<!doctype html>
<html>
  <head>
    <title>祈福导航系统</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="祈福导航系统后台管理"
    />
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon-C1KazUkF.ico" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-hl7koTLS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B7IOe5nM.css">
  </head>

  <body>
    <div id="app">
      <div
        id="qifu-admin-boot"
        style="max-width: 720px; margin: 18vh auto; padding: 32px 28px; color: #334155; font: 15px/1.8 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center"
      >
        <strong style="display: block; margin-bottom: 8px; font-size: 20px">后台正在加载</strong>
        <span>正在准备管理界面，请稍候...</span>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var app = document.getElementById('app')
        var boot = document.getElementById('qifu-admin-boot')
        if (app && boot && app.children.length === 1 && boot.parentNode === app) {
          boot.innerHTML =
            '<strong style="display:block;margin-bottom:8px;font-size:20px">后台资源加载失败</strong>' +
            '<span>请检查 admin/ui/assets 文件是否完整，并确认服务器使用 PHP 8.2 或更高版本。</span>'
        }
      }, 10000)
    </script>
  </body>
</html>
